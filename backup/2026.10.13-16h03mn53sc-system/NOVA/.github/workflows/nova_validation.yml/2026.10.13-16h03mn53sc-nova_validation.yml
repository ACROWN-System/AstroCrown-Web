name: NOVA Validation

on:
  push:
    branches: [main]
    paths:
      - 'NOVA/credential_readiness.py'
      - 'NOVA/roster.json'
      - 'NOVA/gpu_roster.json'
      - 'NOVA/tests/test_credential_readiness.py'
      - 'NOVA/provider_qualification.py'
      - 'NOVA/PROVIDER-QUALIFICATION.md'
      - 'NOVA/tests/test_provider_qualification.py'
      - '.github/workflows/nova-provider-qualification.yml'
      - '.github/workflows/nova_validation.yml'
      - '.github/workflows/nova-weak-rsi.yml'
  workflow_dispatch:

concurrency:
  group: nova-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Compile NOVA Python
        run: python -m compileall -q NOVA

      - name: Run NOVA unit tests
        run: python -m unittest discover -s NOVA/tests -p "test_*.py" -v

  credential-readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GROQ_API_KEY_01: ${{ secrets.GROQ_API_KEY_01 }}
      GEMINI_API_KEY_01: ${{ secrets.GEMINI_API_KEY_01 }}
      CLOUDFLARE_API_KEY_01: ${{ secrets.CLOUDFLARE_API_KEY_01 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOSANA_GPU_API_KEY_01: ${{ secrets.NOSANA_GPU_API_KEY_01 }}
      HF_ZEROGPU_TOKEN_01: ${{ secrets.HF_ZEROGPU_TOKEN_01 }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Inspect credential slot presence only
        run: python -m NOVA.credential_readiness --summary-file "$GITHUB_STEP_SUMMARY"

name: NOVA Autonomous Heartbeat

on:
  push:
    branches: [main]
    paths:
      - 'NOVA/provider_qualification.py'
      - 'NOVA/router.py'
      - 'NOVA/quality_gate.py'
      - 'NOVA/reasoning.py'
      - 'NOVA/health.py'
      - 'NOVA/roster.json'
  # Intentionally omit this workflow file to avoid an incidental live LLM run on merge.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: nova-heartbeat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  heartbeat:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: nova-operational-state-writer
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Test NOVA health and observer primitives
        run: python -m unittest discover -s NOVA/tests -p 'test_*.py' -v

      - name: Load operational state from dedicated branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/nova-operational-state:refs/remotes/origin/nova-operational-state
          python -m NOVA.operational_state load --state-ref origin/nova-operational-state

      - name: Observe external operational annotations
        run: python NOVA/operational_observer.py

      - name: Execute NOVA AI Heart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY_01: ${{ secrets.GROQ_API_KEY_01 }}
          GEMINI_API_KEY_01: ${{ secrets.GEMINI_API_KEY_01 }}
          CLOUDFLARE_API_KEY_01: ${{ secrets.CLOUDFLARE_API_KEY_01 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOVA_ADVANCE_PROVIDER_ROTATION: 'true'
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: python NOVA/router.py

      - name: Analyze newly changed operational annotations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY_01: ${{ secrets.GROQ_API_KEY_01 }}
          GEMINI_API_KEY_01: ${{ secrets.GEMINI_API_KEY_01 }}
          CLOUDFLARE_API_KEY_01: ${{ secrets.CLOUDFLARE_API_KEY_01 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOVA_REASONING_PROVIDER_ROTATION_INDEX: ${{ github.run_number }}
        run: python NOVA/reasoning.py --pending

      - name: Qualify configured LLM credentials and persist sanitized health
        env:
          GROQ_API_KEY_01: ${{ secrets.GROQ_API_KEY_01 }}
          GEMINI_API_KEY_01: ${{ secrets.GEMINI_API_KEY_01 }}
          NOVA_PERSIST_HEALTH_STATE: 'true'
        run: python -m NOVA.provider_qualification
      - name: Publish NOVA structured state to operational branch
        run: |
          python -m NOVA.operational_state publish --state-ref origin/nova-operational-state --message "chore(nova): update AI heart health state [skip ci]"

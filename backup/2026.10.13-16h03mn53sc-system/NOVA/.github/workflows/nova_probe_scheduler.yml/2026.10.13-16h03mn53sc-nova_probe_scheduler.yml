name: NOVA Opportunistic Probe Scheduler

on:
  schedule:
    # Lightweight decision tick. Provider health probes remain 6h apart unless
    # an already-required probe can legitimately reuse capacity before expiry.
    # Offset avoids the top-of-hour load peak noted by GitHub.
    - cron: '2/5 * * * *'
  workflow_dispatch:

concurrency:
  group: nova-heartbeat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decision:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      run_heartbeat: ${{ steps.gate.outputs.run_heartbeat }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load operational state from dedicated branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/nova-operational-state:refs/remotes/origin/nova-operational-state
          python3 -m NOVA.operational_state load --state-ref origin/nova-operational-state

      - name: Decide whether a probe is due or should be advanced
        id: gate
        run: python3 -m NOVA.probe_scheduler --should-run --github-output "$GITHUB_OUTPUT"

  probe:
    needs: decision
    if: github.ref == 'refs/heads/main' && needs.decision.outputs.run_heartbeat == 'true'
    concurrency:
      group: nova-operational-state-writer
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load operational state from dedicated branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/nova-operational-state:refs/remotes/origin/nova-operational-state
          python3 -m NOVA.operational_state load --state-ref origin/nova-operational-state

      - name: Execute NOVA opportunistic health probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROQ_API_KEY_01: ${{ secrets.GROQ_API_KEY_01 }}
          GEMINI_API_KEY_01: ${{ secrets.GEMINI_API_KEY_01 }}
          CLOUDFLARE_API_KEY_01: ${{ secrets.CLOUDFLARE_API_KEY_01 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOVA_ADVANCE_PROVIDER_ROTATION: 'true'
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          TWILIO_TO_NUMBER: ${{ secrets.TWILIO_TO_NUMBER }}
        run: python3 -m NOVA.router

      - name: Publish rolling probe state to operational branch
        run: |
          python3 -m NOVA.operational_state publish --state-ref origin/nova-operational-state --message "chore(nova): update rolling probe schedule [skip ci]"

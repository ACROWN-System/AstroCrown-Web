<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>404 | Access Restricted</title>
    <style>
        :root {
            --bg-color: #0a0b0e;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 480px;
            padding: 2rem;
            border: 1px solid #1e293b;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.6);
        }
        h1 { font-size: 3rem; margin: 0 0 1rem; color: var(--accent-color); }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            color: #0f172a;
            background: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>The requested route does not exist or has been moved to an encrypted address.</p>
        <a href="/">Return to Secure Portal</a>
    </div>
</body>
</html>

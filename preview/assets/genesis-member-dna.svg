<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Genesis Member gold DNA badge</title>
  <desc id="desc">A transparent-background gold medallion with a double helix and the words Genesis Member.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">

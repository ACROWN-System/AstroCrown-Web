name: Dependency Review — Vulnerabilities and Licenses

on:
  pull_request:
    branches: [main]
    paths:
      - "development/auth-prototype/requirements.txt"
      - "development/account-continuity/prototype/requirements.txt"
      - "development/dependencies/**"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-review.yml"

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check new dependencies for known vulnerabilities and invalid license metadata
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime,development,unknown
          vulnerability-check: true
          license-check: true
          show-openssf-scorecard: true

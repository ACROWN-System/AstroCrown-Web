name: Account Case-Management Prototype Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "development/account-continuity/prototype/case_management.py"
      - "development/account-continuity/prototype/tests/test_case_management.py"
      - "development/account-continuity/prototype/cases-ui.js"
      - ".github/workflows/account-continuity-prototype-tests.yml"
  push:
    branches: [main]
    paths:
      - "development/account-continuity/prototype/case_management.py"
      - "development/account-continuity/prototype/tests/test_case_management.py"
      - "development/account-continuity/prototype/cases-ui.js"
      - ".github/workflows/account-continuity-prototype-tests.yml"

permissions:
  contents: read

jobs:
  case-management:
    name: Isolated case-management core
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile the isolated case-management module and tests
        run: python -m py_compile development/account-continuity/prototype/case_management.py development/account-continuity/prototype/tests/test_case_management.py

      - name: Run standard-library case-management regression tests
        run: python -m unittest discover -s development/account-continuity/prototype/tests -p "test_case_management.py" -v

      - name: Check the separate prototype UI syntax
        run: node --check development/account-continuity/prototype/cases-ui.js

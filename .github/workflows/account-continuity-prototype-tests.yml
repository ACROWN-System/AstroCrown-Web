name: Wallet-Only Account UI and Independent Case Module Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "development/account-continuity/**"
      - ".github/workflows/account-continuity-prototype-tests.yml"
  push:
    branches: [main]
    paths:
      - "development/account-continuity/**"
      - ".github/workflows/account-continuity-prototype-tests.yml"

permissions:
  contents: read

jobs:
  wallet-only-interface:
    name: Validate wallet-only account UI and case module
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.1.0
        with:
          node-version: "22"

      - name: Validate browser JavaScript syntax
        run: |
          node --check development/account-continuity/prototype/account-ui.js
          node --check development/account-continuity/prototype/admin-wallet-ui.js
          node --check development/account-continuity/prototype/cases-ui.js
          node --check preview/supporters/supporters.js

      - name: Verify wallet-only account boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path(".")
          ui_path = root / "development/account-continuity/prototype/account-ui.js"
          worker_path = root / "development/account-continuity/worker/src/index.js"
          genesis_path = root / "development/account-continuity/worker/src/genesis.js"
          ui = ui_path.read_text(encoding="utf-8")
          worker = worker_path.read_text(encoding="utf-8")
          genesis = genesis_path.read_text(encoding="utf-8")

          required_ui = (
              "Sign in with wallet",
              "New to AstroCrown?",
              "Create an account",
              "Already have an account?",
              "Create account with wallet",
              "account-wallet-loss-accepted",
              "account-wallet-terms-accepted",
              "walletLossAcknowledged",
              "termsAccepted",
              "eip6963:requestProvider",
              "wallet_requestPermissions",
              "personal_sign",
          )
          missing = [item for item in required_ui if item not in ui]
          if missing:
              raise SystemExit(f"Wallet-only account UI is missing required controls: {missing}")

          forbidden_ui = (
              "Existing legacy passkey test accounts",
              "Continue with legacy passkey",
              "Recover a legacy passkey account",
              "account-passkey-signin",
              "account-one-time-recovery-key",
          )
          present = [item for item in forbidden_ui if item in ui]
          if present:
              raise SystemExit(f"Retired account access UI remains active: {present}")

          for item in (
              "walletLossAcknowledged !== true",
              "walletLossNoticeVersion !== WALLET_LOSS_NOTICE_VERSION",
              "termsAccepted !== true",
              "termsVersion !== TERMS_VERSION",
              "transactionAuthorized: false",
          ):
              if item not in worker:
                  raise SystemExit(f"Server account boundary missing: {item}")

          if any(item in worker for item in (
              "auth_passkeys", "auth_recovery_keys", "authenticated_credential_id",
              "generateRegistrationOptions", "/api/passkeys/",
          )):
              raise SystemExit("A retired passkey/recovery implementation remains in the active account Worker.")

          for item in (
              "handleGenesisWalletApi(request, env, config, account && primaryWallet",
              "accountIdentity.accountId",
              "astro_account_id",
          ):
              if item not in worker + genesis:
                  raise SystemExit(f"Genesis does not use the same AstroCrown account identity: {item}")

          if "genesis_wallet_sessions" in genesis or "/api/genesis/identity/" in genesis:
              raise SystemExit("An independent Genesis account/session path remains.")

          local_auth_paths = (
              root / "development/account-continuity/prototype/server.py",
              root / "development/account-continuity/prototype/passkey_auth.py",
              root / "development/auth-prototype/server.py",
              root / "development/auth-prototype/wallet_auth_core.py",
          )
          residual = [str(path) for path in local_auth_paths if path.exists()]
          if residual:
              raise SystemExit(f"Obsolete local authentication runtimes remain: {residual}")

          authoritative = root / "development/account-continuity/WALLET-ONLY-ACCOUNT-AND-TRANSACTION-SAFETY-REQUIREMENTS.md"
          if not authoritative.exists():
              raise SystemExit("The authoritative wallet-only account requirements document is missing.")
          PY

  independent-case-module:
    name: Test independent case access module (no account login)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the standard-library case-management tests
        run: python -m unittest discover -s development/account-continuity/prototype/tests -p "test_case_management.py" -v

name: AI Media Generator Offline Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "development/ai-media-generator/**"
      - "development/audit/Active/2026-10-14-Cloudflare-Image-MVP-Implementation.md"
      - ".github/workflows/media-generator-tests.yml"
  push:
    branches: [main]
    paths:
      - "development/ai-media-generator/**"
      - "development/audit/Active/2026-10-14-Cloudflare-Image-MVP-Implementation.md"
      - ".github/workflows/media-generator-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile image adapter
        run: python -m py_compile development/ai-media-generator/cloudflare_image.py

      - name: Run deterministic adapter and image-container tests
        run: python -m unittest discover -s development/ai-media-generator/tests -p "test_*.py" -v

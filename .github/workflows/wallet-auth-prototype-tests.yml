name: Local Wallet Authentication Prototype Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "development/auth-prototype/**"
      - "development/dependencies/**"
      - "development/audit/Active/2026-10-20-Local-Only-Wallet-Authentication-Prototype.md"
      - ".github/workflows/wallet-auth-prototype-tests.yml"
  push:
    branches: [main]
    paths:
      - "development/auth-prototype/**"
      - "development/dependencies/**"
      - ".github/workflows/wallet-auth-prototype-tests.yml"

permissions:
  contents: read

jobs:
  offline-and-loopback-tests:
    runs-on: ubuntu-24.04
    # Matches the committed CPython 3.12 Ubuntu 24.04 x86_64 hash-locked wheel set.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify hash-lock package pins
        run: python development/dependencies/verify_ci_dependency_locks.py wallet

      - name: Verify dependency inventories and SPDX snapshots
        run: |
          python development/dependencies/verify_ci_dependency_locks.py all
          python development/dependencies/generate_spdx_sbom.py --check
          python development/dependencies/generate_spdx_sbom.py --lock development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock --output development/dependencies/SBOM-Python-Audit-Toolchain.spdx.json --check
          python -m py_compile development/dependencies/verify_ci_dependency_locks.py development/dependencies/generate_spdx_sbom.py development/dependencies/report_pypi_license_metadata.py development/dependencies/generate_ci_dependency_locks.py

      - name: Install hash-verified Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r development/dependencies/requirements-wallet-auth-py312-ubuntu24-x86_64.lock
          python -m pip freeze

      - name: Create an isolated dependency-audit environment
        run: python -m venv .venv-audit

      - name: Install hash-pinned pip-audit toolchain
        run: .venv-audit/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock

      - name: Audit both locked dependency inventories and collect license metadata
        shell: bash
        run: |
          mkdir -p build/dependency-evidence
          set +e

          .venv-audit/bin/python -m pip_audit --no-deps --require-hashes \
            -r development/dependencies/requirements-account-continuity-py312-ubuntu24-x86_64.lock \
            --format json --output build/dependency-evidence/application-vulnerability-report.json
          app_audit_status=$?

          .venv-audit/bin/python -m pip_audit --no-deps --require-hashes \
            -r development/dependencies/requirements-account-continuity-py312-ubuntu24-x86_64.lock \
            --format cyclonedx-json --output build/dependency-evidence/application-sbom.cdx.json
          app_sbom_status=$?

          python development/dependencies/report_pypi_license_metadata.py \
            --lock development/dependencies/requirements-account-continuity-py312-ubuntu24-x86_64.lock \
            --output build/dependency-evidence/application-pypi-license-metadata.json
          app_license_status=$?

          .venv-audit/bin/python -m pip_audit --no-deps --require-hashes \
            -r development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --format json --output build/dependency-evidence/audit-toolchain-vulnerability-report.json
          tool_audit_status=$?

          .venv-audit/bin/python -m pip_audit --no-deps --require-hashes \
            -r development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --format cyclonedx-json --output build/dependency-evidence/audit-toolchain-sbom.cdx.json
          tool_sbom_status=$?

          python development/dependencies/report_pypi_license_metadata.py \
            --lock development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --output build/dependency-evidence/audit-toolchain-pypi-license-metadata.json
          tool_license_status=$?

          set -e
          echo "application audit=$app_audit_status sbom=$app_sbom_status license-metadata=$app_license_status"
          echo "audit-toolchain audit=$tool_audit_status sbom=$tool_sbom_status license-metadata=$tool_license_status"
          if [ "$app_audit_status" -ne 0 ] || [ "$app_sbom_status" -ne 0 ] || \
             [ "$app_license_status" -ne 0 ] || [ "$tool_audit_status" -ne 0 ] || \
             [ "$tool_sbom_status" -ne 0 ] || [ "$tool_license_status" -ne 0 ]; then
            echo "::error::Dependency audit or evidence collection failed. Review the uploaded reports before changing or promoting dependencies."
            exit 1
          fi

      - name: Upload vulnerability reports, SBOMs and license metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dependency-evidence-${{ github.sha }}
          path: build/dependency-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Compile prototype
        run: python -m py_compile development/auth-prototype/wallet_auth_core.py development/auth-prototype/server.py development/auth-prototype/tests/test_auth.py

      - name: Validate browser JavaScript syntax
        run: |
          node --check development/auth-prototype/app.js
          node --check development/auth-prototype/tests/browser_smoke.mjs

      - name: Run offline and loopback HTTP tests
        run: python -m unittest discover -s development/auth-prototype/tests -p "test_*.py" -v

      - name: Run real headless-browser wallet UI smoke test
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium-browser)"
          else
            echo "::error::BLOCKED: no preinstalled Chrome/Chromium; browser-flow evidence is required before the test-wallet handoff."
            exit 1
          fi
          node development/auth-prototype/tests/browser_smoke.mjs

      - name: Check no external wallet service or transaction path exists in the browser client
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("development/auth-prototype/app.js").read_text(encoding="utf-8")
          forbidden = ("eth_sendTransaction", "eth_signTransaction", "walletconnect", "wallet_connect", "seed phrase", "private key")
          present = [item for item in forbidden if item.casefold() in source.casefold()]
          if present:
              raise SystemExit(f"Unexpected transaction/secret/relay path in browser client: {present}")
          if "personal_sign" not in source or "eth_requestAccounts" not in source:
              raise SystemExit("Expected explicit account connection and message-signing methods.")
          if "fetch(" not in source or '"/api/verify"' not in source:
              raise SystemExit("Expected local same-origin verification request.")
          PY

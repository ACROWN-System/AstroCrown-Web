name: Local Wallet Authentication Prototype Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "development/auth-prototype/**"
      - "development/dependencies/**"
      - "development/audit/Active/2026-10-20-Local-Only-Wallet-Authentication-Prototype.md"
      - ".github/workflows/wallet-auth-prototype-tests.yml"
  push:
    branches: [main]
    paths:
      - "development/auth-prototype/**"
      - "development/dependencies/**"
      - ".github/workflows/wallet-auth-prototype-tests.yml"

permissions:
  contents: read

jobs:
  offline-and-loopback-tests:
    runs-on: ubuntu-24.04
      # Matches the committed CPython 3.12 Ubuntu 24.04 x86_64 hash-locked wheel set.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate temporary pip-audit tool lock candidate
        run: |
          python - <<'PY'
          import hashlib, subprocess, sys, tempfile
          from pathlib import Path
          from pip._vendor.packaging.utils import canonicalize_name, parse_wheel_filename

          with tempfile.TemporaryDirectory(prefix="astrocrown-pip-audit-") as temp:
              folder = Path(temp)
              subprocess.run([
                  sys.executable, "-m", "pip", "download", "--no-cache-dir",
                  "--disable-pip-version-check", "--only-binary=:all:",
                  "--dest", str(folder), "pip-audit==2.10.1",
              ], check=True)
              packages = {}
              for wheel in folder.glob("*.whl"):
                  name, version, _build, _tags = parse_wheel_filename(wheel.name)
                  key = canonicalize_name(name)
                  if key in packages:
                      raise SystemExit(f"Multiple wheels downloaded for {key}")
                  packages[key] = (str(version), hashlib.sha256(wheel.read_bytes()).hexdigest())
              print("===== PIP AUDIT TOOL LOCK =====", flush=True)
              print("# pip-audit 2.10.1 and full resolved dependency closure.", flush=True)
              print("# CPython 3.12 / Ubuntu 24.04 x86_64; wheels only.", flush=True)
              for name in sorted(packages):
                  version, digest = packages[name]
                  print(f"{name}=={version} --hash=sha256:{digest}", flush=True)
              print(f"===== END PIP AUDIT TOOL LOCK ({len(packages)} packages) =====", flush=True)
          PY

      - name: Verify hash-lock package pins
        run: python development/dependencies/verify_ci_dependency_locks.py wallet

      - name: Install hash-verified Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r development/dependencies/requirements-wallet-auth-py312-ubuntu24-x86_64.lock
          python -m pip freeze

      - name: Compile prototype
        run: python -m py_compile development/auth-prototype/wallet_auth_core.py development/auth-prototype/server.py development/auth-prototype/tests/test_auth.py

      - name: Validate browser JavaScript syntax
        run: |
          node --check development/auth-prototype/app.js
          node --check development/auth-prototype/tests/browser_smoke.mjs

      - name: Run offline and loopback HTTP tests
        run: python -m unittest discover -s development/auth-prototype/tests -p "test_*.py" -v

      - name: Run real headless-browser wallet UI smoke test
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium-browser)"
          else
            echo "::error::BLOCKED: no preinstalled Chrome/Chromium; browser-flow evidence is required before the test-wallet handoff."
            exit 1
          fi
          node development/auth-prototype/tests/browser_smoke.mjs

      - name: Check no external wallet service or transaction path exists in the browser client
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("development/auth-prototype/app.js").read_text(encoding="utf-8")
          forbidden = ("eth_sendTransaction", "eth_signTransaction", "walletconnect", "wallet_connect", "seed phrase", "private key")
          present = [item for item in forbidden if item.casefold() in source.casefold()]
          if present:
              raise SystemExit(f"Unexpected transaction/secret/relay path in browser client: {present}")
          if "personal_sign" not in source or "eth_requestAccounts" not in source:
              raise SystemExit("Expected explicit account connection and message-signing methods.")
          if "fetch(" not in source or '"/api/verify"' not in source:
              raise SystemExit("Expected local same-origin verification request.")
          PY

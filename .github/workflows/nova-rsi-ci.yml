name: NOVA RSI Engine CI

on:
  push:
    paths:
      - "development/nova-recursive-self-improvement/**"
      - ".github/workflows/nova-rsi-ci.yml"
      - ".github/workflows/nova-rsi.yml"
      - ".github/workflows/nova-rsi-codeql.yml"
      - ".github/workflows/ossf-scorecard.yml"
      - ".github/workflows/external-review-pipeline-ci.yml"
      - ".github/codeql/nova-rsi-config.yml"
      - ".github/dependabot.yml"
      - "SECURITY.md"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Pull and verify immutable sandbox image
        run: |
          set -euo pipefail
          IMAGE="python@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258"
          EXPECTED_ID="sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258"
          docker pull --platform linux/amd64 "$IMAGE"

          IMAGE_DETAILS="$(docker image inspect "$IMAGE" --format '{{.Id}}|{{.Os}}|{{.Architecture}}|{{json .Config.Env}}')"
          printf 'Resolved immutable image details: %s\n' "$IMAGE_DETAILS"

          ACTUAL_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          ACTUAL_PLATFORM="$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          ACTUAL_PYTHON="$(docker run --rm --platform linux/amd64 "$IMAGE" python3 --version)"

          printf 'Resolved image config ID: %s\n' "$ACTUAL_ID"
          printf 'Expected immutable image config ID: %s\n' "$EXPECTED_ID"
          printf 'Resolved image platform: %s\n' "$ACTUAL_PLATFORM"
          printf 'Container Python version: %s\n' "$ACTUAL_PYTHON"

          test "$ACTUAL_ID" = "$EXPECTED_ID"
          test "$ACTUAL_PLATFORM" = "linux/amd64"
          test "$ACTUAL_PYTHON" = "Python 3.12.15"

      - name: Compile development Python
        run: python -m compileall -q development

      - name: Run RSI unit tests
        run: python -m unittest discover -s development/nova-recursive-self-improvement/tests -p "test_*.py" -v

      - name: Exercise Docker isolation boundaries
        run: python development/nova-recursive-self-improvement/sandbox_runtime.py --self-test

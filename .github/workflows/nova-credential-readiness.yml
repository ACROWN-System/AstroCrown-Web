name: NOVA Credential Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nova-credential-readiness.yml'
      - 'development/nova-recursive-self-improvement/rsi_policy.json'
      - 'development/nova-recursive-self-improvement/GITHUB-AUTOMATION-SETUP.md'
  workflow_dispatch:

concurrency:
  group: nova-credential-readiness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NOSANA_LLM_API_KEY_01: ${{ secrets.NOSANA_LLM_API_KEY_01 }}
      NOVA_RSI_APP_CLIENT_ID: ${{ vars.NOVA_RSI_APP_CLIENT_ID }}
      NOVA_RSI_APP_PRIVATE_KEY: ${{ secrets.NOVA_RSI_APP_PRIVATE_KEY }}
      NOVA_RSI_AUTOMERGE_ENABLED: ${{ vars.NOVA_RSI_AUTOMERGE_ENABLED }}
      RSI_AI_BASE_URL: ${{ vars.RSI_AI_BASE_URL }}
      RSI_AI_MODEL: ${{ vars.RSI_AI_MODEL }}
      RSI_AI_COMMERCIAL_ELIGIBILITY: ${{ vars.RSI_AI_COMMERCIAL_ELIGIBILITY }}
      RSI_BENCHMARK_COMMAND: ${{ vars.RSI_BENCHMARK_COMMAND }}
    steps:
      - name: Checkout main configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report presence-only configuration status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy_path = Path(
              "development/nova-recursive-self-improvement/rsi_policy.json"
          )
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          readiness = policy.get("implementation_readiness", {}).get("status", "UNKNOWN")

          def present(name):
              return bool(os.environ.get(name, "").strip())

          rows = [
              ("NOSANA_LLM_API_KEY_01", "PRESENT" if present("NOSANA_LLM_API_KEY_01") else "MISSING"),
              ("NOVA_RSI_APP_CLIENT_ID", "PRESENT" if present("NOVA_RSI_APP_CLIENT_ID") else "MISSING"),
              ("NOVA_RSI_APP_PRIVATE_KEY", "PRESENT" if present("NOVA_RSI_APP_PRIVATE_KEY") else "MISSING"),
              ("RSI_AI_BASE_URL", "OVERRIDE_PRESENT" if present("RSI_AI_BASE_URL") else "USING_PROTECTED_DEFAULT"),
              ("RSI_AI_MODEL", "OVERRIDE_PRESENT" if present("RSI_AI_MODEL") else "USING_AUTO_DEFAULT"),
              ("RSI_AI_COMMERCIAL_ELIGIBILITY", "PASS" if os.environ.get("RSI_AI_COMMERCIAL_ELIGIBILITY", "").strip() == "PASS" else "NOT_PASS"),
              ("RSI_BENCHMARK_COMMAND", "PRESENT" if present("RSI_BENCHMARK_COMMAND") else "MISSING"),
              ("NOVA_RSI_AUTOMERGE_ENABLED", "ENABLED" if os.environ.get("NOVA_RSI_AUTOMERGE_ENABLED", "").strip().lower() == "true" else "DISABLED_OR_UNSET"),
              ("RSI implementation readiness", readiness),
          ]

          print("AstroCrown-Web RSI configuration readiness (presence/status only)")
          print("| Setting | Status |")
          print("|---|---|")
          summary = [
              "# AstroCrown-Web RSI credential readiness",
              "",
              "Presence/status-only audit. No secret values are emitted and no provider API is called.",
              "",
              "| Setting | Status |",
              "|---|---|",
          ]
          for name, status in rows:
              print(f"| {name} | {status} |")
              summary.append(f"| {name} | {status} |")

          summary.extend([
              "",
              "A present key is not proof of provider authentication, free-tier eligibility, commercial rights, or adequate quota.",
              "Nosana LLM inference is documented as billed per token against credits; zero-cost eligibility must be verified separately before using that key for the $0 plan.",
              "Automatic merging stays disabled unless repository administration explicitly enables it after required branch rules and CI checks are configured.",
              "The RSI implementation-readiness gate remains authoritative and is not modified by this report.",
              "",
          ])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          PY

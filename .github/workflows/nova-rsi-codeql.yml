name: NOVA RSI CodeQL Security Analysis

on:
  push:
    branches: [main]
    paths:
      - "development/nova-recursive-self-improvement/**"
      - "development/audit/external-review/**"
      - ".github/codeql/nova-rsi-config.yml"
      - ".github/workflows/nova-rsi-codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "development/nova-recursive-self-improvement/**"
      - "development/audit/external-review/**"
      - ".github/codeql/nova-rsi-config.yml"
      - ".github/workflows/nova-rsi-codeql.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: nova-rsi-codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    name: CodeQL analysis (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/nova-rsi-config.yml

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

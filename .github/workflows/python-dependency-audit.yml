name: Python Dependency Vulnerability, License Metadata and SBOM Audit

on:
  pull_request:
    branches: [main]
    paths:
      - "development/auth-prototype/requirements.txt"
      - "development/account-continuity/prototype/requirements.txt"
      - "development/dependencies/**"
      - ".github/workflows/python-dependency-audit.yml"
      - ".github/workflows/python-ci-lock-refresh.yml"
      - ".github/dependabot.yml"
      - "development/dependencies/README.md"
  schedule:
    # Weekly scan; no paid scanner or external credentials.
    - cron: "17 3 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit the complete Python CI dependency lock
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify source requirements and committed locks
        run: python development/dependencies/verify_ci_dependency_locks.py account

      - name: Verify committed SPDX inventories against exact package hashes
        run: |
          python development/dependencies/generate_spdx_sbom.py --check
          python development/dependencies/generate_spdx_sbom.py --lock development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock --output development/dependencies/SBOM-Python-Audit-Toolchain.spdx.json --check

      - name: Compile dependency inventory and metadata scripts
        run: |
          python -m py_compile development/dependencies/verify_ci_dependency_locks.py development/dependencies/generate_spdx_sbom.py development/dependencies/report_pypi_license_metadata.py development/dependencies/generate_ci_dependency_locks.py

      - name: Create isolated audit tool environment
        run: python -m venv .venv-audit

      - name: Install the hash-pinned audit toolchain into its isolated environment
        run: .venv-audit/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock

      - name: Audit application dependencies and audit-tool dependencies
        shell: bash
        run: |
          mkdir -p build/dependency-evidence
          set +e

          .venv-audit/bin/python -m pip_audit --no-deps --require-hashes --strict \
            --requirement development/dependencies/requirements-account-continuity-py312-ubuntu24-x86_64.lock \
            --format json --output build/dependency-evidence/application-vulnerability-report.json
          app_audit_status=$?

          .venv-audit/bin/python -m pip_audit --no-deps --require-hashes --strict \
            --requirement development/dependencies/requirements-account-continuity-py312-ubuntu24-x86_64.lock \
            --format cyclonedx-json --output build/dependency-evidence/application-sbom.cdx.json
          app_sbom_status=$?

          python development/dependencies/report_pypi_license_metadata.py \
            --lock development/dependencies/requirements-account-continuity-py312-ubuntu24-x86_64.lock \
            --output build/dependency-evidence/application-pypi-license-metadata.json
          app_license_status=$?

          .venv-audit/bin/python -m pip_audit --no-deps --require-hashes --strict \
            --requirement development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --format json --output build/dependency-evidence/audit-toolchain-vulnerability-report.json
          tool_audit_status=$?

          .venv-audit/bin/python -m pip_audit --no-deps --require-hashes --strict \
            --requirement development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --format cyclonedx-json --output build/dependency-evidence/audit-toolchain-sbom.cdx.json
          tool_sbom_status=$?

          python development/dependencies/report_pypi_license_metadata.py \
            --lock development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --output build/dependency-evidence/audit-toolchain-pypi-license-metadata.json
          tool_license_status=$?

          set -e
          echo "application audit=$app_audit_status sbom=$app_sbom_status license-metadata=$app_license_status"
          echo "audit-toolchain audit=$tool_audit_status sbom=$tool_sbom_status license-metadata=$tool_license_status"

          if [ "$app_audit_status" -ne 0 ] || [ "$app_sbom_status" -ne 0 ] || \
             [ "$app_license_status" -ne 0 ] || [ "$tool_audit_status" -ne 0 ] || \
             [ "$tool_sbom_status" -ne 0 ] || [ "$tool_license_status" -ne 0 ]; then
            echo "::error::A Python dependency audit or evidence-generation step failed. Review all uploaded reports before changing or promoting dependencies."
            exit 1
          fi

      - name: Upload vulnerability report, SBOM and license metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dependency-evidence-${{ github.sha }}
          path: build/dependency-evidence/
          if-no-files-found: warn
          retention-days: 30

name: Account Staging Worker Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "development/account-continuity/worker/**"
      - "development/account-continuity/prototype/account-ui.js"
      - "development/account-continuity/prototype/admin-wallet-ui.js"
      - "development/account-continuity/prototype/account-prototype.css"
      - "development/index.html"
      - "preview/supporters/**"
      - "preview/genesis-ethereum-treasury-proof.html"
      - "preview/genesis-tron-treasury-proof.html"
      - "development/supporter-programme/**"
      - ".github/workflows/account-staging-worker-qualification.yml"
      - ".github/workflows/cloudflare-staging-deployment.yml"
      - ".github/workflows/cloudflare-account02-readonly-preflight.yml"
  push:
    branches: [main]
    paths:
      - "development/account-continuity/worker/**"
      - "development/account-continuity/prototype/account-ui.js"
      - "development/account-continuity/prototype/admin-wallet-ui.js"
      - "development/account-continuity/prototype/account-prototype.css"
      - "development/index.html"
      - "preview/supporters/**"
      - "development/supporter-programme/**"
      - ".github/workflows/account-staging-worker-qualification.yml"
      - ".github/workflows/cloudflare-staging-deployment.yml"

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: development/account-continuity/worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.1.0
        with:
          node-version: "22"

      - name: Generate the reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run wallet-only Worker invariant tests
        run: npm test

      - name: Run canonical Genesis schema tests
        run: python -m unittest discover -s ../../supporter-programme/tests -p 'test_schema.py'

      - name: Build the restricted website asset set
        run: npm run build:site

      - name: Verify published Genesis page and account scripts
        run: |
          node --check public/supporters/supporters.js
          node --check public/account-continuity/prototype/account-ui.js
          node scripts/test-staging-site-build.mjs

      - name: Validate Worker and deployment scripts without deploying
        run: |
          node --check src/index.js
          node --check src/genesis.js
          node --check src/supporters.js
          node --check scripts/build-staging-site.mjs
          node --check scripts/deploy-staging.mjs
          npm run check:worker

      - name: Apply local account and Genesis programme D1 schemas
        run: |
          printf 'y\n' | npx wrangler d1 migrations apply acrown-account-staging --local
          printf 'y\n' | npx wrangler d1 migrations apply acrown-supporters-mainnet --local

      - name: Smoke-test wallet-only local Worker APIs
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/acrown-worker.log" 2>&1 &
          worker_pid=$!
          cleanup() { kill "$worker_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          base="http://localhost:8787"
          ready=false
          for attempt in $(seq 1 40); do
            if curl --resolve localhost:8787:127.0.0.1 -fsS "$base/api/account/status" -o "$RUNNER_TEMP/account-status.json"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/acrown-worker.log"
            echo "::error::Local Worker did not become ready."
            exit 1
          fi

          node --input-type=module - "$base" "$RUNNER_TEMP/account-status.json" <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const base = process.argv[2];
          const status = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          assert.equal(status.authenticated, false);
          assert.equal(status.walletSignInAvailable, true);
          assert.equal(status.walletAuthFamily, "evm-eoa");
          assert.equal(status.scope, "staging-test-account-only");
          assert.equal("passkeyAvailable" in status, false);
          assert.equal("legacyPasskeySignInAvailable" in status, false);

          const diagnosticResponse = await fetch(base + "/api/diagnostics/runtime");
          assert.equal(diagnosticResponse.status, 200);
          const diagnostics = await diagnosticResponse.json();
          assert.equal(diagnostics.primaryWalletAuthentication, "EIP-191 personal-sign");
          assert.equal(diagnostics.signInAuthorizesTransaction, false);
          assert.equal(diagnostics.paymentAcceptanceEnabled, false);

          const challengeResponse = await fetch(base + "/api/account/primary-wallet/options", {
            method: "POST",
            headers: {
              Origin: base,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              address: "0x0000000000000000000000000000000000000001",
              chainId: 1,
            }),
          });
          assert.equal(challengeResponse.status, 200);
          const challenge = await challengeResponse.json();
          assert.equal(challenge.signatureOnly, true);
          assert.equal(challenge.transactionAuthorized, false);
          assert.equal(challenge.walletFamily, "evm-eoa");
          assert.equal(challenge.chainId, 1);
          assert.ok(challenge.message.includes(new URL(base).origin));
          assert.ok(challenge.message.includes("does not authorize a blockchain transaction"));

          const wrongOriginResponse = await fetch(base + "/api/account/primary-wallet/options", {
            method: "POST",
            headers: {
              Origin: "https://untrusted.invalid",
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              address: "0x0000000000000000000000000000000000000001",
              chainId: 1,
            }),
          });
          assert.equal(wrongOriginResponse.status, 403);

          const retiredPasskeyResponse = await fetch(base + "/api/passkeys/authentication/options", {
            method: "POST",
            headers: {
              Origin: base,
              "Content-Type": "application/json",
            },
            body: "{}",
          });
          assert.equal(retiredPasskeyResponse.status, 404);

          const anonymousGenesisProfile = await fetch(base + "/api/genesis/me");
          assert.equal(anonymousGenesisProfile.status, 401);

          const genesisStatusResponse = await fetch(base + "/api/supporters/status");
          assert.equal(genesisStatusResponse.status, 200);
          const genesisStatus = await genesisStatusResponse.json();
          assert.equal(genesisStatus.environment, "MAINNET");
          assert.equal(genesisStatus.programme?.status, "PRELAUNCH");
          assert.equal(genesisStatus.paymentAcceptance?.enabled, false);
          assert.equal(genesisStatus.paymentAcceptance?.qualifyingPaymentsAccepted, false);
          assert.equal(genesisStatus.purchaseAllowance?.automaticTokenIssuance, false);
          assert.deepEqual(genesisStatus.networks?.map(item => item.network), ["ethereum", "tron", "solana"]);
          assert.ok(genesisStatus.networks.every(item => item.networkConfigured === false && item.treasuryConfigured === true));

          const homepageResponse = await fetch(base + "/");
          assert.equal(homepageResponse.status, 200);
          const homepage = await homepageResponse.text();
          assert.ok(homepage.includes("LIVE PUBLIC TEST ENVIRONMENT"));
          assert.ok(homepage.includes("astro-account-runtime"));

          const genesisPageResponse = await fetch(base + "/supporters/");
          assert.equal(genesisPageResponse.status, 200);
          const genesisPage = await genesisPageResponse.text();
          assert.ok(genesisPage.includes("there is no separate Genesis account or Genesis sign-in"));
          assert.ok(genesisPage.includes("Sign in to your AstroCrown account"));
          assert.ok(genesisPage.includes("Verify and link additional address"));

          console.log("Wallet-only local Worker API qualification passed. No account, private key, payment or transfer was created.");
          NODE

      - name: Parse the manual Cloudflare deployment workflow
        run: |
          ruby -e 'require "yaml"; YAML.load_file("../../../.github/workflows/cloudflare-staging-deployment.yml"); puts "Cloudflare deployment workflow YAML parsed successfully."'

      - name: Verify the Account 02 preflight remains read-only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("../../../.github/workflows/cloudflare-account02-readonly-preflight.yml")
          source = path.read_text(encoding="utf-8")
          required = [
              'CLOUDFLARE_API_TOKEN_02',
              'CLOUDFLARE_ACCOUNT_ID_02',
              'method="GET"',
              'expected_worker = "astrocrown-account-staging-staging"',
              '/workers/scripts?per_page=100&page=1',
              '/d1/database?per_page=100&page=1',
              '::add-mask::',
              'payment-method or billing-profile endpoints',
              'report["token_authentication"]',
              'USAGE_MODEL_REPORTED_FOR_AUDIT_ONLY',
              'The Workers account-settings API reports the default usage-model setting, not the account subscription or payment-method state.',
          ]
          for value in required:
              if value not in source:
                  raise SystemExit("Preflight workflow missing safe behavior: " + value)
          for forbidden in [
              'method="POST"', 'method="PUT"', 'method="PATCH"', 'method="DELETE"',
              'wrangler deploy', 'wrangler d1', '/user/tokens/verify'
          ]:
              if forbidden in source:
                  raise SystemExit("Preflight workflow contains a forbidden mutation: " + forbidden)
          print("Account 02 preflight uses only GET requests and sanitized inventory reporting.")
          PY

      - name: Parse the read-only Cloudflare preflight workflow
        run: |
          ruby -e 'require "yaml"; YAML.load_file("../../../.github/workflows/cloudflare-account02-readonly-preflight.yml"); puts "Cloudflare read-only preflight workflow YAML parsed successfully."'

      - name: Verify the remote environment remains isolated and fail-closed
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";

          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const stage = config.env.staging;
          const deployScript = fs.readFileSync("scripts/deploy-staging.mjs", "utf8");
          if (!Array.isArray(stage.d1_databases) || stage.d1_databases.length !== 2) {
            throw new Error("Staging must have separate account and programme D1 data bindings.");
          }
          const programmeDb = stage.d1_databases[1];
          if (
            programmeDb.binding !== "SUPPORTERS_DB" ||
            programmeDb.database_name !== "acrown-supporters-mainnet" ||
            programmeDb.database_id !== "00000000-0000-0000-0000-000000000000" ||
            programmeDb.migrations_dir !== "migrations/supporters"
          ) {
            throw new Error("The Genesis programme D1 binding must retain its separate non-deployable sentinel.");
          }
          if (!deployScript.includes("resolveSupportersDatabase") ||
              !deployScript.includes("ASTROCROWN_SUPPORTERS_D1_DATABASE_ID")) {
            throw new Error("Deployment must identity-pin the separate programme data database.");
          }
          const workerGuard = deployScript.indexOf("await requireExistingStagingWorker(accountId, sourceConfig.env.staging.name)");
          const usageModelReport = deployScript.indexOf("await reportWorkersUsageModel(accountId)");
          const d1Provision = deployScript.indexOf("const state = await resolveDatabase(accountId)");
          if (workerGuard < 0 || usageModelReport < 0 || d1Provision < 0 ||
              workerGuard > d1Provision || usageModelReport > d1Provision) {
            throw new Error("Worker-existence and informational usage checks must precede D1 provisioning.");
          }
          if (!deployScript.includes("does not report subscription status or payment methods") ||
              !deployScript.includes("not treated as proof of an active paid subscription")) {
            throw new Error("Usage-model reporting must not be confused with subscription or payment-method status.");
          }
          if (deployScript.includes("assertWorkersUsageModelIsNotStandard") ||
              deployScript.includes("STOPPED BEFORE D1 PROVISIONING")) {
            throw new Error("The usage-model label alone must not block the explicitly authorized Free/no-card deployment.");
          }
          if (stage.vars.RP_ID !== "SET_BEFORE_DEPLOY") throw new Error("Staging RP sentinel missing.");
          if (stage.vars.EXPECTED_ORIGIN !== "https://SET_BEFORE_DEPLOY.invalid") throw new Error("Staging origin sentinel missing.");
          if (stage.d1_databases[0].database_id !== "00000000-0000-0000-0000-000000000000") {
            throw new Error("Staging account D1 sentinel missing.");
          }
          NODE

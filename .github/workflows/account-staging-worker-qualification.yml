name: Account Staging Worker Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - "development/account-continuity/worker/**"
      - "development/account-continuity/prototype/account-ui.js"
      - "development/account-continuity/prototype/admin-wallet-ui.js"
      - "development/account-continuity/prototype/account-prototype.css"
      - "development/index.html"
      - "development/page-entry/**"
      - "preview/supporters/**"
      - "preview/genesis-ethereum-treasury-proof.html"
      - "preview/genesis-tron-treasury-proof.html"
      - "development/supporter-programme/**"
      - ".github/workflows/account-staging-worker-qualification.yml"
      - ".github/workflows/cloudflare-staging-deployment.yml"
      - ".github/workflows/cloudflare-account02-readonly-preflight.yml"
  push:
    branches: [docs/provider-independent-wallet-auth-plan-2026-10-20]
    paths:
      - "development/account-continuity/worker/**"
      - "development/account-continuity/prototype/account-ui.js"
      - "development/account-continuity/prototype/admin-wallet-ui.js"
      - "development/account-continuity/prototype/account-prototype.css"
      - "development/index.html"
      - "development/page-entry/**"
      - "preview/supporters/**"
      - "development/supporter-programme/**"
      - ".github/workflows/account-staging-worker-qualification.yml"
      - ".github/workflows/cloudflare-staging-deployment.yml"

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: development/account-continuity/worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.1.0
        with:
          node-version: "22"
      - name: Generate the reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Worker invariant tests
        run: npm test
      - name: Run canonical and Worker-mirrored Supporter Programme schema tests
        run: python -m unittest discover -s ../../supporter-programme/tests -p 'test_schema.py'
      - name: Build the restricted website asset set
        run: npm run build:site

      - name: Verify the published Genesis page and wallet script
        run: |
          node --check public/supporters/supporters.js
          node --check public/page-entry/page-entry-notice.js
          node scripts/test-staging-site-build.mjs
      - name: Validate browser code and Worker bundle without deploying
        run: |
          node --check src/index.js
          node --check scripts/build-staging-site.mjs
          node --check public/account-continuity/prototype/account-ui.js
          node --check public/page-entry/page-entry-notice.js
          node --check scripts/test-primary-wallet-auth-e2e.mjs
          npm run check:worker
      - name: Apply local account and isolated Supporter Programme D1 schemas
        run: |
          printf 'y\n' | npx wrangler d1 migrations apply acrown-account-staging --local
          printf 'y\n' | npx wrangler d1 migrations apply acrown-supporters-mainnet --local
      - name: Smoke-test the local Worker HTTP API and homepage
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 > "$RUNNER_TEMP/acrown-worker.log" 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          base="http://localhost:8787"
          ready=false
          for attempt in $(seq 1 40); do
            if curl --resolve localhost:8787:127.0.0.1 -fsS "$base/api/account/status" -o "$RUNNER_TEMP/account-status.json"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/acrown-worker.log"
            echo "::error::Local Worker did not become ready."
            exit 1
          fi
          node --input-type=module - "$RUNNER_TEMP/account-status.json" <<'NODE'
          import fs from "node:fs";
          const status = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (status.authenticated !== false) throw new Error("A fresh local request must be unauthenticated.");
          if (status.scope !== "staging-test-account-only") throw new Error("The account scope marker is missing.");
          if (status.walletAuthenticationAvailable !== true) throw new Error("The primary-wallet account API must be advertised in local qualification.");
          if (status.walletAuthenticationNetworks?.join(",") !== "ethereum,tron,solana") throw new Error("The account wallet network allowlist is inconsistent.");
          NODE
          curl --resolve localhost:8787:127.0.0.1 -fsS "$base/api/genesis/status" -o "$RUNNER_TEMP/genesis-status.json"
          node --input-type=module - "$RUNNER_TEMP/genesis-status.json" <<'NODE'
          import fs from "node:fs";
          const status = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (status.environment !== "MAINNET" || status.programme?.status !== "PRELAUNCH") throw new Error("Genesis Programme must report MAINNET PRELAUNCH.");
          if (status.paymentAcceptance?.enabled !== false || status.paymentAcceptance?.qualifyingPaymentsAccepted !== false) throw new Error("Mainnet payment acceptance must remain disabled.");
          if (status.purchaseAllowance?.automaticTokenIssuance !== false || status.purchaseAllowance?.separateFromQualifyingPayment !== true) throw new Error("A qualifying payment must not automatically issue ACROWN.");
          if (status.networks?.map(x => x.network).join(",") !== "ethereum,tron,solana") throw new Error("Genesis Programme must expose the exact three-network allowlist.");
          if (status.networks.some(x => x.networkConfigured || !x.treasuryConfigured)) throw new Error("All three owner-approved Genesis treasuries must be recorded while every payment network remains disabled.");
          NODE
          ASTROCROWN_LOCAL_WORKER_ORIGIN="$base" node scripts/test-primary-wallet-auth-e2e.mjs
                    curl --resolve localhost:8787:127.0.0.1 -fsS "$base/" -o "$RUNNER_TEMP/home.html"
          grep -q "LIVE PUBLIC TEST ENVIRONMENT" "$RUNNER_TEMP/home.html"
          curl --resolve localhost:8787:127.0.0.1 -fsS "$base/supporters/" -o "$RUNNER_TEMP/supporters.html"
          grep -q "USDT QUALIFYING PAYMENTS NOT OPEN" "$RUNNER_TEMP/supporters.html"
          grep -q "DO NOT SEND FUNDS" "$RUNNER_TEMP/supporters.html"
          curl --resolve localhost:8787:127.0.0.1 -fsS "$base/supporters/supporters.js" -o "$RUNNER_TEMP/supporters.js"
          grep -q "TIP6963:announceProvider" "$RUNNER_TEMP/supporters.js"
          code=$(curl --resolve localhost:8787:127.0.0.1 -sS -o "$RUNNER_TEMP/wrong-origin.json" -w "%{http_code}" -X POST "$base/api/wallet-auth/challenge" -H "Origin: https://untrusted.invalid" -H "Content-Type: application/json" --data "{}")
          test "$code" = "403"
          echo "Wallet signing UI is syntax-checked; physical wallet/provider qualification remains a separate release gate."
      - name: Parse the manual Cloudflare deployment workflow
        run: |
          ruby -e 'require "yaml"; YAML.load_file("../../../.github/workflows/cloudflare-staging-deployment.yml"); puts "Cloudflare deployment workflow YAML parsed successfully."'

      - name: Verify the Account 02 preflight is read-only and bound to existing credentials
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("../../../.github/workflows/cloudflare-account02-readonly-preflight.yml")
          source = path.read_text(encoding="utf-8")
          required = [
              'CLOUDFLARE_API_TOKEN_02',
              'CLOUDFLARE_ACCOUNT_ID_02',
              'method="GET"',
              'expected_worker = "astrocrown-account-staging-staging"',
              '/workers/scripts?per_page=100&page=1',
              '/d1/database?per_page=100&page=1',
              '::add-mask::',
              'payment-method or billing-profile endpoints',
              'report["token_authentication"]',
              'USAGE_MODEL_REPORTED_FOR_AUDIT_ONLY',
              'The Workers account-settings API reports the default usage-model setting, not the account subscription or payment-method state.',
          ]
          for value in required:
              if value not in source:
                  raise SystemExit("Preflight workflow missing required safe behavior: " + value)
          for forbidden in ['method="POST"', 'method="PUT"', 'method="PATCH"', 'method="DELETE"', 'wrangler deploy', 'wrangler d1', '/user/tokens/verify']:
              if forbidden in source:
                  raise SystemExit("Preflight workflow contains a forbidden mutating operation: " + forbidden)
          if any(fragment in source for fragment in [
              "print(token)",
              "print(CLOUDFLARE_API_TOKEN)",
          ]):
              raise SystemExit("Preflight workflow appears to expose credential material.")
          print("Account 02 preflight uses only GET requests, existing repository credentials, and sanitized inventory reporting.")
          PY

      - name: Parse the read-only Cloudflare preflight workflow
        run: |
          ruby -e 'require "yaml"; YAML.load_file("../../../.github/workflows/cloudflare-account02-readonly-preflight.yml"); puts "Cloudflare read-only preflight workflow YAML parsed successfully."'

      - name: Verify remote environment is still fail-closed
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
          const stage = config.env.staging;
          const deployScript = fs.readFileSync("scripts/deploy-staging.mjs", "utf8");
          if (!Array.isArray(stage.d1_databases) || stage.d1_databases.length !== 2) {
            throw new Error("Staging must have separate account and Supporter Programme D1 bindings.");
          }
          const supporterDb = stage.d1_databases[1];
          if (
            supporterDb.binding !== "SUPPORTERS_DB" ||
            supporterDb.database_name !== "acrown-supporters-mainnet" ||
            supporterDb.database_id !== "00000000-0000-0000-0000-000000000000" ||
            supporterDb.migrations_dir !== "migrations/supporters"
          ) {
            throw new Error("The dedicated Supporter Programme D1 binding must retain its separate non-deployable sentinel.");
          }
          if (!deployScript.includes("resolveSupportersDatabase") || !deployScript.includes("ASTROCROWN_SUPPORTERS_D1_DATABASE_ID")) {
            throw new Error("Staging deployment must identity-pin the dedicated Supporter Programme D1 database.");
          }
          const workerGuard = deployScript.indexOf("await requireExistingStagingWorker(accountId, sourceConfig.env.staging.name)");
          const usageModelReport = deployScript.indexOf("await reportWorkersUsageModel(accountId)");
          const d1Provision = deployScript.indexOf("const state = await resolveDatabase(accountId)");
          if (workerGuard < 0 || usageModelReport < 0 || d1Provision < 0 || workerGuard > d1Provision || usageModelReport > d1Provision) {
            throw new Error("Worker-existence and informational usage-model checks must run before D1 provisioning.");
          }
          if (!deployScript.includes("does not already exist") || !deployScript.includes("cannot create a new Worker")) {
            throw new Error("The deployment script must explain the Workers Editor create-permission boundary.");
          }
          if (!deployScript.includes("does not report subscription status or payment methods") || !deployScript.includes("not treated as proof of an active paid subscription")) {
            throw new Error("The deployment script must keep usage-model reporting separate from subscription/payment-method verification.");
          }
          if (deployScript.includes("assertWorkersUsageModelIsNotStandard") || deployScript.includes("STOPPED BEFORE D1 PROVISIONING")) {
            throw new Error("A usage-model label alone must not block the explicitly owner-authorized Free/no-card deployment.");
          }
          if (stage.vars.EXPECTED_ORIGIN !== "https://SET_BEFORE_DEPLOY.invalid") throw new Error("Staging origin sentinel missing.");
          if (stage.d1_databases[0].database_id !== "00000000-0000-0000-0000-000000000000") throw new Error("Staging D1 sentinel missing.");
          NODE

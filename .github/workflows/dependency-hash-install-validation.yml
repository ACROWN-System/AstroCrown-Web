name: Temporary Hash-Locked Dependency Install Validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dependency-hash-install-validation.yml"

permissions:
  contents: read

jobs:
  account-lock-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify source pins and committed hashes
        run: python development/dependencies/verify_ci_dependency_locks.py account

      - name: Install hash-verified account dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r development/dependencies/requirements-account-continuity-py312-ubuntu24-x86_64.lock

      - name: Run account continuity backend tests
        run: python -m unittest discover -s development/account-continuity/prototype/tests -p "test_*.py" -v

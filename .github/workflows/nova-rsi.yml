name: NOVA Recursive Self-Improvement

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: nova-rsi
  cancel-in-progress: false

jobs:
  budget-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout policy
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enforce daily RSI cycle budget
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail

          LIMIT="\$(python - <<'PY'
          import json
          with open("development/nova-recursive-self-improvement/rsi_policy.json", encoding="utf-8") as handle:
              print(json.load(handle)["budget"]["max_cycles_per_utc_day"])
          PY
          )"

          TODAY="\$(date -u +%Y-%m-%d)"
          PRIOR_RUNS="\$(gh run list \
            --repo "\$GITHUB_REPOSITORY" \
            --workflow nova-rsi.yml \
            --created "\${TODAY}.." \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId' | grep -vx "\$GITHUB_RUN_ID" | grep -c . || true)"

          echo "Protected daily RSI cycle budget: \$LIMIT"
          echo "Prior RSI workflow runs today (excluding this run): \$PRIOR_RUNS"

          if [ "\$PRIOR_RUNS" -ge "\$LIMIT" ]; then
            echo "RSI daily budget exhausted; refusing another proposer cycle."
            exit 1
          fi

  rsi-cycle:
    needs: budget-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Enforce proposer commercial-use eligibility
        env:
          RSI_AI_COMMERCIAL_ELIGIBILITY: \${{ vars.RSI_AI_COMMERCIAL_ELIGIBILITY }}
        run: |
          test "\$RSI_AI_COMMERCIAL_ELIGIBILITY" = "PASS"

      - name: Run bounded autonomous RSI cycle
        env:
          RSI_AI_BASE_URL: \${{ vars.RSI_AI_BASE_URL }}
          RSI_AI_MODEL: \${{ vars.RSI_AI_MODEL }}
          RSI_AI_API_KEY: \${{ secrets.RSI_AI_API_KEY }}
          RSI_BENCHMARK_COMMAND: \${{ vars.RSI_BENCHMARK_COMMAND }}
        run: |
          python development/nova-recursive-self-improvement/rsi_engine.py cycle \
            --repo . \
            --evidence-dir .rsi-evidence

      - name: Upload RSI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-rsi-evidence-\${{ github.run_id }}
          path: .rsi-evidence/
          if-no-files-found: warn

  retain-qualified-candidate:
    needs: rsi-cycle
    if: needs.rsi-cycle.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download RSI evidence
        uses: actions/download-artifact@v4
        with:
          name: nova-rsi-evidence-\${{ github.run_id }}
          path: .rsi-evidence

      - name: Retain qualified candidate
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail

          BRANCH="rsi/candidate-\${GITHUB_RUN_ID}"
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/\${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/\${GITHUB_REPOSITORY}.git"
          fi
          gh auth setup-git
          git fetch origin main
          git switch -c "\$BRANCH" "\$GITHUB_SHA"
          git apply .rsi-evidence/candidate.patch
          git config user.name "NOVA RSI"
          git config user.email "nova-rsi@localhost"
          git add development/
          git commit -m "rsi: retain verified candidate \${GITHUB_RUN_ID}"
          git push --set-upstream origin "\$BRANCH"
          gh pr create \
            --base main \
            --head "\$BRANCH" \
            --title "NOVA RSI candidate \${GITHUB_RUN_ID}" \
            --body "Automated NOVA RSI candidate retained after protected evaluation. See the workflow artifact for the evidence package."

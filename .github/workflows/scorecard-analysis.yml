name: OpenSSF Scorecard Analysis

on:
  # The official Scorecard Action requires the repository's default branch.
  # This intentionally activates only after an approved change reaches main.
  push:
    branches:
      - main
  schedule:
    # Weekly; the scheduled run evaluates the default branch.
    - cron: "30 1 * * 6"

# Public-repository Scorecard runs use the built-in GitHub token only.
# No PAT, repository secret, OIDC publishing or external paid service is used.
permissions: read-all

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Keep publication disabled until the first reports are reviewed.
          # The scan and SARIF upload remain free for this public repository.
          publish_results: false

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssf-scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to GitHub code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif

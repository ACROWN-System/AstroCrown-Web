name: Banner Backend Python Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "development/admin/banner_backend/**"
      - "development/admin/announcement-band-editor.html"
      - "development/audit/Active/2026-10-19-Announcement-Band-Editor-Phase-1.md"
      - "development/audit/Active/2026-10-20-Python-Banner-Editor-Integration.md"
      - "development/audit/Active/2026-10-20-Carousel-Scene-Link-Editor.md"
      - ".github/workflows/banner-backend-python-tests.yml"
  push:
    branches: [main]
    paths:
      - "development/admin/banner_backend/**"
      - "development/admin/announcement-band-editor.html"
      - ".github/workflows/banner-backend-python-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile backend prototype
        run: |
          python -m py_compile \
            development/admin/banner_backend/__init__.py \
            development/admin/banner_backend/service.py \
            development/admin/banner_backend/server.py

      - name: Validate inline editor JavaScript syntax
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path("development/admin/announcement-band-editor.html").read_text(encoding="utf-8")
          if source.count("<script>") != 1 or source.count("</script>") != 1:
              raise SystemExit("Expected exactly one inline editor script")
          script = source.split("<script>", 1)[1].split("</script>", 1)[0]
          Path(os.environ["RUNNER_TEMP"], "announcement-band-editor.js").write_text(script, encoding="utf-8")
          PY
          node --check "$RUNNER_TEMP/announcement-band-editor.js"

      - name: Run unit and local HTTP API tests
        run: python -m unittest discover -s development/admin/banner_backend/tests -t . -p "test_*.py" -v
      - name: Run real-browser save/reload/conflict smoke test
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium)"
          elif command -v chromium-browser >/dev/null 2>&1; then
            export CHROME_BIN="$(command -v chromium-browser)"
          else
            echo "::warning::BLOCKED: no preinstalled Chrome/Chromium binary; browser verification remains blocked"
            exit 0
          fi
          node development/admin/banner_backend/tests/browser_smoke.mjs


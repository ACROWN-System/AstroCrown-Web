name: Python Dependency Governance — Audit Toolchain

on:
  pull_request:
    branches: [main]
    paths:
      - "development/dependencies/**"
      - ".github/dependabot.yml"
      - ".github/workflows/python-ci-lock-refresh.yml"
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify current wheel hashes or regenerate the audit-tool lock candidate"
        type: choice
        required: true
        default: verify
        options:
          - verify
          - regenerate

permissions:
  contents: read

concurrency:
  group: python-audit-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-lock:
    name: Verify or regenerate the isolated audit-tool lock
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify committed audit-tool hashes against fresh wheel downloads
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify')
        run: python development/dependencies/generate_ci_dependency_locks.py --check

      - name: Generate the reviewed audit-tool lock candidate
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'regenerate')
        run: python development/dependencies/generate_ci_dependency_locks.py

      - name: Verify exact source-pin and wheel-lock parity
        run: python development/dependencies/verify_ci_dependency_locks.py all

      - name: Upload the audit-tool lock candidate
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'regenerate')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-audit-tool-lock-${{ github.sha }}
          path: development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Audit the isolated Python security-scanner toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the audit-tool source pin and committed wheel lock
        run: python development/dependencies/verify_ci_dependency_locks.py all

      - name: Verify the SPDX 2.3 audit-tool inventory
        run: python development/dependencies/generate_spdx_sbom.py --check

      - name: Compile dependency governance scripts
        run: |
          python -m py_compile \
            development/dependencies/verify_ci_dependency_locks.py \
            development/dependencies/verify_dependency_audit_evidence.py \
            development/dependencies/generate_spdx_sbom.py \
            development/dependencies/report_pypi_license_metadata.py \
            development/dependencies/generate_ci_dependency_locks.py

      - name: Create isolated audit-tool environment
        run: python -m venv .venv-audit

      - name: Install the SHA-256-pinned audit toolchain
        run: .venv-audit/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock

      - name: Audit the isolated toolchain and collect publisher license metadata
        shell: bash
        run: |
          mkdir -p build/dependency-evidence
          set +e

          .venv-audit/bin/python -m pip_audit --strict --disable-pip --require-hashes \
            --requirement development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --format json --output build/dependency-evidence/audit-toolchain-vulnerability-report.json
          audit_status=$?

          .venv-audit/bin/python -m pip_audit --strict --disable-pip --require-hashes \
            --requirement development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --format cyclonedx-json --output build/dependency-evidence/audit-toolchain-sbom.cdx.json
          sbom_status=$?

          python development/dependencies/report_pypi_license_metadata.py \
            --lock development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --output build/dependency-evidence/audit-toolchain-pypi-license-metadata.json
          license_status=$?

          python development/dependencies/verify_dependency_audit_evidence.py \
            --lock development/dependencies/requirements-pip-audit-py312-ubuntu24-x86_64.lock \
            --vulnerability-report build/dependency-evidence/audit-toolchain-vulnerability-report.json \
            --cyclonedx-report build/dependency-evidence/audit-toolchain-sbom.cdx.json
          coverage_status=$?

          set -e
          echo "audit=$audit_status sbom=$sbom_status license-metadata=$license_status coverage=$coverage_status"
          if [ "$audit_status" -ne 0 ] || [ "$sbom_status" -ne 0 ] || \
             [ "$license_status" -ne 0 ] || [ "$coverage_status" -ne 0 ]; then
            echo "::error::The audit-tool vulnerability scan or evidence generation failed. Review the uploaded evidence."
            exit 1
          fi

      - name: Upload audit-tool vulnerability report, SBOM and publisher metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-audit-tool-evidence-${{ github.sha }}
          path: build/dependency-evidence/
          if-no-files-found: warn
          retention-days: 14

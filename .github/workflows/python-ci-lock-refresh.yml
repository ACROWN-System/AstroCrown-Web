name: Python CI Wheel-Lock Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - "development/auth-prototype/requirements.txt"
      - "development/account-continuity/prototype/requirements.txt"
      - "development/dependencies/generate_ci_dependency_locks.py"
      - ".github/workflows/python-ci-lock-refresh.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Verify current artifact hashes or regenerate lock candidates"
        type: choice
        required: true
        default: verify
        options:
          - verify
          - regenerate

permissions:
  contents: read

jobs:
  wheel-locks:
    name: Verify or regenerate platform-specific wheel locks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify committed locks against fresh wheel downloads
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify'
        run: python development/dependencies/generate_ci_dependency_locks.py --check

      - name: Generate lock candidates from reviewed source pins
        if: github.event_name == 'pull_request' || inputs.mode == 'regenerate'
        run: python development/dependencies/generate_ci_dependency_locks.py

      - name: Verify exact package-version parity after generation
        run: python development/dependencies/verify_ci_dependency_locks.py all

      - name: Upload candidate wheel locks for owner-reviewed application
        if: github.event_name == 'pull_request' || inputs.mode == 'regenerate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-ci-wheel-lock-candidates-${{ github.sha }}
          path: |
            development/dependencies/requirements-wallet-auth-py312-ubuntu24-x86_64.lock
            development/dependencies/requirements-account-continuity-py312-ubuntu24-x86_64.lock
          if-no-files-found: error
          retention-days: 14
